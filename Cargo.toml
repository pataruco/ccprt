[package]
name = "ccprt"
version = "1.1.0"
edition = "2021"
description = "Checks that PRs follow Conventional Commits conventions"
license = "ISC"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
octocrab = { version = "0.44", features = ["rustls-webpki-tokio"] }
git-conventional = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
